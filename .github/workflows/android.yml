name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (streaks, stats, pause/resume, goals, leaderboard)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk StudyTimelapse-debug.apk

      # A stable direct-download link that works well from a phone browser:
      # https://github.com/<owner>/<repo>/releases/download/latest-debug/StudyTimelapse-debug.apk
      - name: Publish phone-friendly download
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Latest debug build
          prerelease: true
          body: "Debug APK built from ${{ github.sha }}. Open this page on your phone and tap StudyTimelapse-debug.apk to install."
          files: StudyTimelapse-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyTimelapse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7
